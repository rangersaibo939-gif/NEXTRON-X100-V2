name: NEXTRON Builder v2

on:
  push:
    branches:
      - feature/nextron-builder-v2
  pull_request:
    branches:
      - main
      - feature/nextron-builder-v2

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run builder tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q tests/test_builder_v2.py
