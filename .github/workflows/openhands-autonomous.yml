name: NEXTRON Autonomous Developer

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for OpenHands'
        required: false
        default: 'Inspect the NEXTRON Builder V2 backlog, implement the highest-priority incomplete task, run tests, fix failures, and open/update a PR. Do not modify main directly.'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nextron-openhands
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenHands
        uses: All-Hands-AI/openhands-github-action@v1
        with:
          openhands-api-key: ${{ secrets.OPENHANDS_API_KEY }}
          prompt: ${{ github.event.inputs.prompt || 'Read docs/NEXTRON_BUILDER_V2.md and the open issues. Select the highest-priority incomplete Builder V2 task. Implement it fully, add or update tests, run the relevant tests/build, repair failures, and open or update a PR. Never push directly to main. Keep working through the selected task until it is genuinely complete.' }}
          poll: 'true'
          max-iterations: '30'
