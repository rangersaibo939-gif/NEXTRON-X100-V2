name: NEXTRON V2 Autonomous Builder

on:
  push:
    branches: [feature/nextron-builder-v2]
  pull_request:
    branches: [main, feature/nextron-builder-v2]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
      timezone: "Asia/Kolkata"

concurrency:
  group: nextron-v2-autonomous
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous:
    if: ${{ !contains(github.event.head_commit.message || '', '[nextron-agent]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NEXTRON_AGENT_MODEL: openrouter/auto
      NEXTRON_AGENT_MAX_ITERATIONS: "5"
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: feature/nextron-builder-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify baseline
        run: |
          python -m py_compile core/nextron.py core/app_plan.py core/ai_planner.py
          python -m pytest -q

      - name: Run autonomous coding loop
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        run: python tools/nextron_agent.py

      - name: Explain missing API key
        if: ${{ env.OPENROUTER_API_KEY == '' }}
        run: |
          echo "OPENROUTER_API_KEY is not configured."
          echo "Add it as a repository Actions secret to enable autonomous coding."
          exit 1

      - name: Final validation
        run: |
          python -m py_compile core/nextron.py core/app_plan.py core/ai_planner.py
          python -m pytest -q
          git status --short

      - name: Commit autonomous changes
        run: |
          if git diff --quiet; then
            echo "No changes produced by autonomous agent."
            exit 0
          fi
          git config user.name "nextron-autonomous-agent"
          git config user.email "nextron-autonomous-agent@users.noreply.github.com"
          git add -- core .github tools tests docs NEXTRON_V2_AUTONOMOUS.md test_*.py
          git commit -m "[nextron-agent] autonomous V2 progress"
          git push origin feature/nextron-builder-v2
